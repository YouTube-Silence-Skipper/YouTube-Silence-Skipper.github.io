name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      theme:
        description: "default = seasonal theme picked automatically by date; plain = never seasonal; or pin one theme"
        type: choice
        options: [default, plain, christmas, black-friday, halloween]
        default: default

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - name: Build site
        run: npm run build
        env:
          # push events build "default" (automatic seasonal theme); a manual run can pick
          # plain or pin one theme.
          THEME: ${{ github.event.inputs.theme || 'default' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
